<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EduFocus+ Soleil sur le livre">
  <defs>
    <linearGradient id="gold" x1="60" y1="29" x2="60" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7D98B"/>
      <stop offset="1" stop-color="#E88F3A"/>
    </linearGradient>
    <linearGradient id="ring" x1="8" y1="60" x2="112" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8B04A"/>
      <stop offset="0.55" stop-color="#E88F3A"/>
      <stop offset="1" stop-color="#4EC3A3"/>
    </linearGradient>
  </defs>

  <!-- Anneau de mise au point, ouvert au zénith -->
  <circle cx="60" cy="60" r="52" stroke="url(#ring)" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="290.4 36.3"
          transform="rotate(-18 60 60)"/>

  <!-- Rayons du soleil -->
  <g stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round">
    <line x1="79" y1="44" x2="83" y2="44"/>
    <line x1="73.4" y1="57.4" x2="76.3" y2="60.3"/>
    <line x1="60" y1="63" x2="60" y2="67"/>
    <line x1="46.6" y1="57.4" x2="43.7" y2="60.3"/>
    <line x1="41" y1="44" x2="37" y2="44"/>
    <line x1="46.6" y1="30.6" x2="43.7" y2="27.7"/>
    <line x1="60" y1="25" x2="60" y2="21"/>
    <line x1="73.4" y1="30.6" x2="76.3" y2="27.7"/>
  </g>

  <!-- Soleil levant dont le cœur est un + -->
  <circle cx="60" cy="44" r="15" fill="url(#gold)"/>
  <path d="M56 34 h8 v5 h5 v10 h-5 v5 h-8 v-5 h-5 v-10 h5 Z" fill="#F4EDDE"/>

  <!-- Livre ouvert, horizon du Sahel -->
  <g fill="#F4EDDE" fill-opacity="0.96" stroke="#2F9B82" stroke-width="2" stroke-linejoin="round">
    <path d="M60 78 L36 72 L28 84 L60 92 Z"/>
    <path d="M60 78 L84 72 L92 84 L60 92 Z"/>
  </g>
  <line x1="60" y1="78" x2="60" y2="92" stroke="url(#gold)" stroke-width="2"/>

  <!-- Gouttes d'encre (motif artisan) -->
  <circle cx="36" cy="60" r="2" fill="#4EC3A3"/>
  <circle cx="84" cy="60" r="2" fill="#E88F3A"/>
</svg>
